name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: router-1c-mcp.exe
            archive: router-1c-mcp-windows-x64.zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: router-1c-mcp
            archive: router-1c-mcp-linux-x64.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('rust/Cargo.lock') }}

      # Linux: сборка под glibc 2.17 через cargo-zigbuild. Обычная сборка на
      # ubuntu-latest требует glibc самого раннера и не запускается на более
      # старых дистрибутивах. 2.17 — нижняя граница, которую поддерживает Rust.
      - name: Install zig (Linux)
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install cargo-zigbuild (Linux)
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build release binary
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            cargo zigbuild --release --manifest-path rust/Cargo.toml --target ${{ matrix.target }}.2.17
          else
            cargo build --release --manifest-path rust/Cargo.toml --target ${{ matrix.target }}
          fi

      - name: Check glibc requirement (Linux)
        if: runner.os == 'Linux'
        run: |
          NEED=$(objdump -T "rust/target/${{ matrix.target }}/release/${{ matrix.artifact }}" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "${{ matrix.artifact }} требует ${NEED}"
          if [ "$(printf '%s\nGLIBC_2.17\n' "$NEED" | sort -V | tail -1)" != "GLIBC_2.17" ]; then
            echo "::error::${{ matrix.artifact }} требует ${NEED} — новее GLIBC_2.17"
            exit 1
          fi

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Compress-Archive -Path "rust/target/${{ matrix.target }}/release/${{ matrix.artifact }}" -DestinationPath "${{ matrix.archive }}"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar czf ${{ matrix.archive }} -C rust/target/${{ matrix.target }}/release ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Описание выпуска берём из журнала изменений: автосводка GitHub собирает
      # список запросов на слияние, а здесь коммиты идут прямо в ветку.
      - name: Build release notes from changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 -c "import re,sys,pathlib; v=sys.argv[1]; t=pathlib.Path('CHANGELOG.md').read_text(encoding='utf-8'); m=re.search(rf'^## \[{re.escape(v)}\].*?(?=^## \[|\Z)', t, re.M|re.S); print(m.group(0).strip() if m else 'См. раздел [' + v + '] в CHANGELOG.md.')" "$VERSION" > release-notes.md
          head -5 release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: true
          files: artifacts/*
